# Builds the single-file apps and publishes the demo to GitHub Pages:
#   /               Splayer (Design 2)
#   /letsplay.html  the original LetsPlay design (Design 1)
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [claude/affectionate-mendel-wtp8rn, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the apps and the static site
        run: python3 scripts/build.py --site
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on (source: GitHub Actions) the first time, if the token is allowed to.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
